services:
  swarm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swarm-production-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_FALLBACK_MODELS=${GROQ_FALLBACK_MODELS:-}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-}
      - GROQ_VISION_FALLBACK_MODELS=${GROQ_VISION_FALLBACK_MODELS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SWARM_AUTH_DB_PATH=/data/swarm_auth.sqlite3
      - VECTOR_CACHE_DB_PATH=/data/vector_cache.sqlite3
      - ACTIVITY_DB_PATH=/data/query_activity.sqlite3
      - WEB_RESEARCH_DB_PATH=/data/web_research.sqlite3
      - EVIDENCE_LEDGER_DB_PATH=/data/evidence_ledger.sqlite3
      - WEB_EMBEDDING_MODEL_CACHE_PATH=/data/fastembed
      - VECTOR_CACHE_SIMILARITY_THRESHOLD=${VECTOR_CACHE_SIMILARITY_THRESHOLD:-0.93}
    volumes:
      - swarm-auth-data:/data
    restart: unless-stopped

volumes:
  swarm-auth-data:
